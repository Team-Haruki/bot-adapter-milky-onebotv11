name: Release Build

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: milky-ob11-bridge

concurrency:
  group: release-build-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve target release
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "release") {
              const tagName = context.payload.release?.tag_name;
              if (!tagName) {
                core.setFailed("release event is missing tag_name");
                return;
              }
              core.setOutput("tag_name", tagName);
              return;
            }

            try {
              const { data: release } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("tag_name", release.tag_name);
            } catch (error) {
              core.setFailed(`failed to resolve latest release: ${error.message}`);
            }

  build:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            archive: tar.gz
            ext: ""
            run_tests: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            archive: tar.gz
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin_arm64
            archive: tar.gz
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin_amd64
            archive: tar.gz
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            archive: zip
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows_arm64
            archive: zip
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        if: matrix.run_tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BIN_EXT: ${{ matrix.ext }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          set -euo pipefail

          base_name="${APP_NAME}_${TAG_NAME}_${PLATFORM}"
          package_dir="dist/${base_name}"
          binary_name="${APP_NAME}${BIN_EXT}"
          archive_path="dist/${base_name}.${ARCHIVE_TYPE}"

          rm -rf dist
          mkdir -p "${package_dir}"

          cp "target/${TARGET}/release/${binary_name}" "${package_dir}/${binary_name}"
          cp README.md "${package_dir}/README.md"
          cp config.example.json "${package_dir}/config.example.json"

          if [ "${ARCHIVE_TYPE}" = "zip" ]; then
            (
              cd dist
              7z a -tzip "${base_name}.zip" "${base_name}" >/dev/null
            )
          else
            tar -C dist -czf "${archive_path}" "${base_name}"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_path}" > "${archive_path}.sha256"
          else
            shasum -a 256 "${archive_path}" > "${archive_path}.sha256"
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs:
      - resolve-release
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
